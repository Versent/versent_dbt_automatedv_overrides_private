name: versent_dbt_automatedv_overrides_private
version: '1.0.0'
config-version: 2
require-dbt-version: ['>=1.0.1', '<2.0.0']
profile: 'versent-snowflake'

# Paths
macro-paths: [ "macros" ]
model-paths: [ "models" ]
analysis-paths: [ "analysis" ]
test-paths: [ "tests" ]
seed-paths: [ "seeds" ]
snapshot-paths: [ "snapshots" ]

# Build artifacts / cleanup
target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

vars:
  bk_ghost: ghost