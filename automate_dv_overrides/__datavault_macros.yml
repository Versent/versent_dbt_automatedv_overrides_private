version: 2

macros:
  - name: cbc
    description: >
      This macro brings together hubs pits and satellites to create a consolidated model of Core Business Concepts (CBC)
    arguments:
      - name: hash_key
        type: binary
        description: the hash key
      - name: hub
        type: string
        description: Is used to create a reference to the hub of the cbc
      - name: pit
        type: string
        description: Is used to create a reference to a point in time (PIT) view of the hub and satellites of the cbc
      - name: satellites
        type: array
        description: a list of satellites to be joined, to the pit. will be joined by the hash key and load_date time between the pit and the satellites(s)
      - name: payload
        type: dictionary
        description: list of keys values etc that describes what is required from each satellite
      - name: derivations
        type: dictionary
        description: transformations performed on the items from the payload
  - name: pit_as_of_date
    description: >
      This macro captures all historical "as-of" dates for records from the associated satellite tables.
    arguments:
      - name: satellites
        type: array
        description: a list of satellites where we get "as-of" dates for a record.
  - name: pit
    description: >
      This macro uses the hub, pit_as_of_date and satellite to identify the relevant records from each satellite for a specific date/timestamp.
      It records the HK and LDTS (load_datetime) value from the satellite(s) which enables the CBC the use of equi-joins to get
      the satellite record at a point in time.
      Satellite is joined on the Hashed Key(HK) and if the as_of_date is between the satellite record's effectivity period.
      Effective_From will be the earliest date when it's the first record otherwise it will be the load_datetime.
      Effective_To will be the next record's load_datetime minus 1 millisecond otherwise it will be the latest date.
      Pit_as_of_date table and as_of_date arguments are now optional please see below descriptions for details.

    arguments:
      - name: hub
        type: string
        description: used to create a reference to the hub
      - name: hash_key
        type: binary
        description: the hash key 
      - name: business_key
        type: string
        description: (Optional) - Optional for backward compatability, the business key for the core business concept
      - name: as_of_dates_table
        type: string
        description: >
          (Optional) Reference to the pit_as_of_table. If this is not provided, the PIT macro will generate it's own
          as_of_dates(referred to as generated_as_of_dates).
      - name: as_of_date
        type: string
        description: >
          (Optional) Name of the as_of_date column. This is not required if the as_of_dates_table is not provided.
          However, the macro expects the satellite tables to have the load_datetime field.   
      - name: record_source
        type: string
        description: (Optional) Where the data came from     
      - name: load_datetime
        type: timestamp
        description: (Optional) Date time when the record was loaded  
      - name: satellites
        type: array
        description: a list of satellites where we get "as-of" dates for a record.

  - name: sat
    description: >
      Override of the automate_dv satellite macro, to include a business key and cast it to bk_ghost value if it is null (i.e. the ghost record).
      The arguments are the same as automate_dv, with an additional optional buiness_key. Due to the quirks of the macro and how we do thinks
      both the business key parameter need to be used, and the bk_<core_business_concept_name> included in the payload. Otherwise it will not be able 
      to find it. [Enhancement required here - use the hub to get the business key in the macro and not have it in the payload]
    arguments:
      - name: business_key
        type: string
        description: Name of the business key required. Too be included in the payload as well